[project]
name = "agentic-helper"
version = "0.1.0"
description = "A thin in-process harness that wraps the Nous Research Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Both are optional at runtime (the harness degrades gracefully without them),
    # but recommended for the nicer REPL + .env loading.
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
agentic-helper = "agentic_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_helper"]
